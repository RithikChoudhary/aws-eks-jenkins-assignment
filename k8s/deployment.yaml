apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-api
  namespace: devops-assignment
  labels:
    app: sample-api
spec:
  replicas: 1
  revisionHistoryLimit: 5
  progressDeadlineSeconds: 180

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  selector:
    matchLabels:
      app: sample-api

  template:
    metadata:
      labels:
        app: sample-api
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30

      containers:
        - name: sample-api
          image: IMAGE_URI_PLACEHOLDER
          imagePullPolicy: Always

          ports:
            - name: http
              containerPort: 3000
              protocol: TCP

          envFrom:
            - configMapRef:
                name: sample-api-config
            - secretRef:
                name: sample-api-secret

          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 192Mi

          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL

          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
